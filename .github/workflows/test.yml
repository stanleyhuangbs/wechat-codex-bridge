name: test

on:
  push:
  pull_request:

jobs:
  package:
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m compileall -q src tools
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Clean install and CLI smoke
        run: >-
          python -c "import pathlib,subprocess,sys,venv;
          venv.EnvBuilder(with_pip=True).create('clean-venv');
          scripts=pathlib.Path('clean-venv')/('Scripts' if sys.platform=='win32' else 'bin');
          wheel=next(pathlib.Path('dist').glob('*.whl'));
          subprocess.run([str(scripts/('python.exe' if sys.platform=='win32' else 'python')),'-m','pip','install','--no-deps',str(wheel)],check=True);
          subprocess.run([str(scripts/('wechat-codex-bridge.exe' if sys.platform=='win32' else 'wechat-codex-bridge')),'--help'],check=True);
          subprocess.run([str(scripts/('wechat-codex-bridge-admin.exe' if sys.platform=='win32' else 'wechat-codex-bridge-admin')),'--help'],check=True)"
      - run: python tools/check_public_package.py --root . --wheel dist/wechat_codex_bridge-0.1.0-py3-none-any.whl
      - name: Parse Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          Get-ChildItem deploy/windows/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
          }
          if ($parseErrors) { $parseErrors; exit 1 }
